<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Octagon · Parts Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Kaushan+Script&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<style>
  :root {
    --bg: #f6f6f3; --surface: #fff; --ink: #17181a; --ink2: #3a3d42; --muted: #6b7077;
    --line: #e6e6e1; --soft: #f1f1ed; --accent: #0f6b57; --accent-ink: #fff; --accent-soft: #e2f2ed;
    --warn: #8a5a00; --warn-soft: #fff0cc; --danger: #b3261e; --danger-soft: #fdeceb;
    --radius: 14px; --shadow: 0 6px 24px rgba(20, 24, 22, .14);
    --gutter-l: max(16px, env(safe-area-inset-left, 0px));
    --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1110; --surface: #171918; --ink: #ecece9; --ink2: #c9cbc8; --muted: #9a9fa4;
      --line: #272a29; --soft: #1e2120; --accent: #46c4a3; --accent-ink: #06231b; --accent-soft: #12302a;
      --warn: #f0c060; --warn-soft: #352a10; --danger: #ff8a80; --danger-soft: #3a1c1a;
      --shadow: 0 6px 24px rgba(0, 0, 0, .5);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.45 Inter, system-ui, sans-serif; overflow-x: hidden; padding-bottom: 96px; -webkit-text-size-adjust: 100%; }
  .wrap { max-width: 860px; margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
  .hidden { display: none !important; }
  h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -.01em; }
  .top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0 8px; }
  .tagline { color: var(--muted); font-size: 13px; margin-top: 2px; }

  .sticky { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 96%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); padding: 6px 0 8px; }
  .search { position: relative; display: block; }
  .search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
  input, select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; min-width: 0; width: 100%; color-scheme: light dark; }
  .search input { height: 48px; padding-left: 42px; border-radius: 14px; font-size: 16px; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, .row-head:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; white-space: nowrap; border: 1px solid var(--line); background: var(--surface); color: var(--ink2); border-radius: 999px; padding: 6px 13px; font-size: 13px; font-weight: 500; }
  .tab .n { color: var(--muted); margin-left: 5px; font-weight: 400; }
  .tab[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .tab[aria-selected="true"] .n { color: inherit; opacity: .7; }

  button { font: inherit; cursor: pointer; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 15px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14px; white-space: nowrap; }
  .btn:hover { background: var(--soft); }
  .btn.sm { height: 34px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn.ghost:hover { background: var(--soft); }
  .btn.warnlink { color: var(--danger); }

  .notice { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; margin: 8px 0 10px; padding: 9px 12px; border-radius: 12px; background: var(--accent-soft); color: var(--ink2); font-size: 13px; }
  .notice b { color: var(--ink); font-weight: 600; }
  .notice-actions { display: flex; gap: 6px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink2); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 500; }
  .chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .filters select { width: auto; flex: 1 1 calc(50% - 4px); font-size: 13px; padding: 7px 10px; text-overflow: ellipsis; }
  .filters .chip { flex: none; }
  .listbar { display: flex; align-items: center; justify-content: space-between; margin: 4px 2px 8px; color: var(--muted); font-size: 13px; }
  .selall { display: flex; align-items: center; gap: 8px; }
  input[type="checkbox"] { width: 19px; height: 19px; padding: 0; accent-color: var(--accent); flex: none; }

  .list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .row { border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row-head { display: grid; grid-template-columns: auto 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; cursor: pointer; }
  .row-head:hover, .row.open .row-head { background: var(--soft); }
  .thumb { width: 44px; height: 44px; border-radius: 10px; background: var(--soft); display: grid; place-items: center; }
  .thumb { position: relative; overflow: hidden; }
  .thumb .pimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .row.open .thumb, .row-head:hover .thumb { background: var(--surface); }
  .thumb svg { width: 36px; height: 36px; fill: none; stroke: var(--ink2); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; filter: url(#rough); }
  .info { min-width: 0; }
  .name { font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
  .sub2 { color: var(--muted); font-size: 12.5px; margin-top: 2px; overflow-wrap: anywhere; }
  .sub2 .mono { color: var(--ink2); font-size: 12px; }
  .pill { display: inline-block; border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 600; margin-left: 4px; vertical-align: 1px; }
  .pill.ill { background: var(--soft); color: var(--ink2); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .price { font-weight: 600; font-size: 14px; text-align: right; }
  .price.none { color: var(--muted); font-weight: 400; font-size: 12px; }
  .detail { padding: 2px 12px 14px; background: var(--soft); }
  .facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; margin: 6px 0 12px; }
  .detail-grid { display: grid; grid-template-columns: 1fr; gap: 10px 16px; align-items: start; margin: 6px 0 12px; }
  .detail-grid .facts { margin: 0; align-content: start; }
  .lbl-thumb { display: block; width: 100%; padding: 0; margin: 0; border: 0; background: none; cursor: zoom-in; text-align: center; font: inherit; color: var(--muted); }
  .lbl-thumb .lbl-box { width: 100%; }
  .lbl-thumb .lbl { pointer-events: none; box-shadow: 0 1px 4px rgba(0, 0, 0, .18); }
  .lbl-thumb:hover .lbl { box-shadow: 0 2px 10px rgba(0, 0, 0, .3); }
  .lbl-thumb-hint { display: block; margin-top: 5px; font-size: 11.5px; }
  .fact { margin: 0; min-width: 0; }
  .fact.wide { grid-column: 1 / -1; }
  .fact dt { font-size: 11.5px; color: var(--muted); margin-bottom: 1px; }
  .fact dd { margin: 0; font-size: 14px; overflow-wrap: anywhere; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .confirm { margin-top: 12px; padding: 12px; border-radius: 12px; background: var(--danger-soft); color: var(--ink); font-size: 14px; }
  .confirm .actions { margin-top: 10px; }
  .tagline b { color: var(--ink); font-weight: 600; }
  .hint { font-size: 12px; color: var(--muted); font-weight: 400; min-height: 0; }
  .hint:empty { display: none; }
  .hint.warn { color: var(--warn); }
  .views { display: flex; gap: 4px; background: var(--soft); border-radius: 12px; padding: 4px; margin-bottom: 4px; }
  .views button { flex: 1; border: 0; background: transparent; border-radius: 9px; padding: 8px 10px; font-weight: 600; font-size: 13.5px; color: var(--ink2); }
  .views button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .14); }
  .views .n { font-weight: 400; color: var(--muted); margin-left: 6px; }
  .qty { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0 12px; }
  .qbox { flex: 1 1 140px; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px 10px; }
  .qlabel { display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; color: var(--muted); margin-bottom: 6px; }
  .sample-pill { font-size: 10px; border-radius: 999px; padding: 0 7px; background: var(--warn-soft); color: var(--warn); font-weight: 600; }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .sbtn { flex: none; width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--soft); color: var(--ink); font-size: 20px; line-height: 1; padding: 0; }
  .sbtn:hover { background: var(--line); }
  .qin { text-align: center; font-size: 18px; font-weight: 600; height: 36px; padding: 0 6px; }
  .more { text-align: center; margin: 14px 0; }
  .empty { padding: 34px 16px; text-align: center; color: var(--muted); }
  .empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }
  .empty .btn { margin-top: 12px; }

  .form { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 8px; }
  .form label { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); font-weight: 500; min-width: 0; }
  .form .err { color: var(--danger); font-size: 13px; min-height: 0; }
  @media (min-width: 640px) { .form { grid-template-columns: 1fr 1fr; } .form .full { grid-column: 1 / -1; } .facts { grid-template-columns: repeat(4, minmax(0, 1fr)); } .detail-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 50%); } .detail-grid .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  .bulk { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 0 var(--gutter-r) calc(12px + env(safe-area-inset-bottom, 0px)) var(--gutter-l); pointer-events: none; }
  .bulk-card { pointer-events: auto; max-width: 860px; margin: 0 auto; background: var(--ink); color: var(--bg); border-radius: 16px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; box-shadow: var(--shadow); }
  .bulk-card .grow { flex: 1; font-weight: 600; font-size: 14px; }
  .bulk-card input { width: 92px; height: 34px; padding: 0 10px; }
  .bulk-card .btn { background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 35%, transparent); }
  .bulk-card .btn.primary { background: var(--bg); color: var(--ink); border-color: var(--bg); }
  .bulk-err { width: 100%; font-size: 12.5px; color: var(--warn-soft); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60; max-width: calc(100vw - 32px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; box-shadow: var(--shadow); }
  .toast.bad { background: var(--danger); color: #fff; }
  body.has-bulk .toast { bottom: 86px; }

  .sheet { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; background: rgba(8, 10, 9, .5); }
  .sheet-card { background: var(--surface); width: 100%; max-width: 620px; max-height: 92vh; overflow: auto; border-radius: 20px 20px 0 0; padding: 18px var(--gutter-r) calc(18px + env(safe-area-inset-bottom, 0px)) var(--gutter-l); }
  @media (min-width: 640px) { .sheet { align-items: center; } .sheet-card { border-radius: 20px; padding: 22px; } }
  .sheet h2 { margin: 0 0 4px; font-size: 18px; }
  .sheet-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .msg { border-radius: 12px; padding: 10px 12px; margin: 10px 0; font-size: 14px; background: var(--accent-soft); }
  .msg.bad { background: var(--danger-soft); }
  .msg.warn { background: var(--warn-soft); }
  .msg ul { margin: 6px 0 0; padding-left: 18px; max-height: 200px; overflow: auto; }
  #label-area { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 10px 0; }
  .lbl-opts { display: flex; gap: 12px; width: 100%; max-width: 480px; }
  .lbl-opts label { flex: 1; display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); font-weight: 500; }
  .lbl-note { font-size: 12.5px; color: var(--muted); max-width: 480px; text-align: center; margin: 0; }
  /* The label: same layout as the Thermoplan bag label (big article number, description, quantity, barcode), with the Octagon logo. */
  .lbl-box { container-type: inline-size; width: min(100%, 480px); }
  .lbl { width: 100%; aspect-ratio: 5 / 3; background: #fff; color: #000; border: 1px solid #999; border-radius: 6px; display: grid; grid-template-columns: 15cqw 1fr; grid-template-rows: minmax(0, 1fr); overflow: hidden; font-family: Inter, Arial, sans-serif; text-align: left; box-sizing: border-box; }
  .lbl * { box-sizing: border-box; }
  .lbl-side { display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 2cqw; padding: 3.2cqw 0 3cqw; border-right: .4cqw solid #000; }
  .lbl-brand { writing-mode: vertical-rl; transform: rotate(180deg); text-align: left; line-height: 1.2; white-space: nowrap; min-height: 0; overflow: hidden; }
  .lbl-brand b { display: block; font-size: 3.9cqw; letter-spacing: .01em; }
  .lbl-brand span { font-size: 2.5cqw; letter-spacing: .04em; }
  .lbl-logo { width: 12.4cqw; height: 12.4cqw; flex: none; }
  .lbl-main { display: flex; flex-direction: column; padding: 2.4cqw 4cqw 2cqw; min-width: 0; min-height: 0; }
  .lbl-sku { font-size: 10cqw; font-weight: 700; line-height: 1; letter-spacing: -.01em; font-family: "JetBrains Mono", monospace; }
  .lbl-rule { height: .45cqw; background: #000; margin: 1.4cqw 0 1.6cqw; }
  .lbl-en { font-size: 4.8cqw; line-height: 1.12; font-weight: 500; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .lbl-es { font-size: 3.8cqw; line-height: 1.12; color: #333; margin-top: .6cqw; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .lbl-qty { margin-top: auto; padding-top: .8cqw; font-size: 5cqw; font-weight: 700; }
  .lbl-foot { display: grid; grid-template-columns: 1fr auto; gap: 3cqw; align-items: end; margin-top: 1.2cqw; }
  .lbl-foot svg { width: 100%; height: 13.5cqw; display: block; }
  .lbl-meta { text-align: right; font-size: 3cqw; line-height: 1.35; color: #222; white-space: nowrap; }
  #label-print { display: none; }
  @page { size: 4in 2.4in; margin: 0; }
  @media print {
    body > *:not(#label-print) { display: none !important; }
    body { background: #fff; padding: 0; }
    #label-print { display: block; }
    #label-print .lbl-box { width: 4in; page-break-after: always; break-after: page; page-break-inside: avoid; }
    #label-print .lbl-box:last-child { page-break-after: auto; break-after: auto; }
    #label-print .lbl { border: 0; border-radius: 0; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .row-head, .tab, .chip, .btn { transition: background-color .12s, border-color .12s, color .12s; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/>
  </filter>
</svg>

<div class="wrap">
  <div class="top-row">
    <div>
      <h1>Mastrena parts catalog</h1>
      <div class="tagline" id="tagline"></div>
    </div>
    <button class="btn primary" id="btn-add" type="button">+ Add part</button>
  </div>
  <div class="views" id="views" role="tablist" aria-label="View"></div>
</div>

<div class="sticky">
  <div class="wrap">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search name or SKU" aria-label="Search by name or SKU" autocomplete="off" enterkeyhint="search">
    </label>
    <div class="tabs" id="tabs" role="tablist" aria-label="Module"></div>
  </div>
</div>

<main class="wrap">
  <div class="notice" role="note">
    <div><b>Saved in this browser only.</b> Each device keeps its own copy. Export the CSV after editing to back up or share.<span id="storage-error" class="hidden"> <b>This browser can't save (private mode or storage blocked), so changes will be lost when you close it.</b></span></div>
    <div class="notice-actions">
      <button class="btn sm" id="btn-export" type="button">Export CSV</button>
      <button class="btn sm" id="btn-import" type="button">Import CSV</button>
      <input id="file" type="file" accept=".csv,text/csv" class="hidden">
    </div>
  </div>

  <div class="filters">
    <button class="chip" id="chip-noprice" type="button" aria-pressed="false">No price</button>
    <button class="chip hidden" id="chip-review" type="button" aria-pressed="false">With doubts</button>
    <select id="sub" aria-label="Filter by subassembly"></select>
    <select id="sort" aria-label="Sort parts">
      <option value="manual">Sort: manual</option>
      <option value="sku">Sort: SKU</option>
      <option value="name">Sort: name</option>
      <option value="price">Sort: price</option>
      <option value="review">Sort: doubts first</option>
    </select>
  </div>

  <div class="listbar">
    <label class="selall"><input type="checkbox" id="selall" aria-label="Select all matching parts"><span id="count"></span></label>
  </div>
  <ul class="list" id="list"></ul>
  <div class="more"><button class="btn hidden" id="btn-more" type="button">Show more</button></div>
</main>

<div class="bulk hidden" id="bulk">
  <div class="bulk-card">
    <span class="grow" id="bulk-n"></span>
    <input id="bulk-price" inputmode="decimal" placeholder="CAD" aria-label="Price in CAD for the selected parts" autocomplete="off">
    <button class="btn sm primary" id="bulk-apply" type="button">Set price</button>
    <button class="btn sm" id="bulk-clear" type="button">Clear price</button>
    <button class="btn sm primary hidden" id="bulk-verify" type="button">Mark verified</button>
    <button class="btn sm" id="bulk-done" type="button">Done</button>
    <div class="bulk-err" id="bulk-err" role="alert"></div>
  </div>
</div>
<div class="toast hidden" id="toast" role="status"></div>
<div id="label-print" aria-hidden="true"></div>

<div class="sheet hidden" id="sheet-add" role="dialog" aria-modal="true" aria-label="New part">
  <div class="sheet-card">
    <div class="sheet-top"><h2>New part</h2><button class="btn ghost sm" data-act="close" type="button" aria-label="Close">Close</button></div>
    <div id="add-form"></div>
  </div>
</div>

<div class="sheet hidden" id="sheet-import" role="dialog" aria-modal="true" aria-label="Import CSV">
  <div class="sheet-card" aria-live="polite">
    <div class="sheet-top"><h2>Import CSV</h2><button class="btn ghost sm" data-act="close" type="button" aria-label="Close">Close</button></div>
    <div id="import-body"></div>
    <div class="actions" style="margin-top:12px">
      <button class="btn primary" id="btn-import-ok" type="button">Replace catalog</button>
      <button class="btn" id="btn-import-cancel" type="button">Cancel</button>
    </div>
  </div>
</div>

<div class="sheet hidden" id="sheet-label" role="dialog" aria-modal="true" aria-label="Barcode label">
  <div class="sheet-card">
    <div class="sheet-top"><h2>Bag label</h2><button class="btn ghost sm" data-act="close" type="button" aria-label="Close">Close</button></div>
    <div id="label-area"></div>
    <div class="actions"><button class="btn primary" id="btn-print" type="button">Print label</button></div>
  </div>
</div>

<script>
(() => {
  // Validation mode is for the team only: open the page with ?validate (served locally, with data/internal/parts_all.csv).
  // Everyone else sees only the verified catalog.
  const VALIDATE = new URLSearchParams(location.search).has('validate');
  const STORAGE_KEY = VALIDATE ? 'octagon-inv-v1-validate' : 'octagon-inv-v1';
  const SEEDS = VALIDATE ? ['data/internal/parts_all.csv', 'data/parts.csv'] : ['data/parts.csv'];
  const PAGE = 40;
  const MODULES = ['Mechanical', 'Steam', 'Hydraulic', 'Chassis', 'Other'];
  const COLS = ['sku','sku_8digit','page','name_en','name_es','module','subassembly','price_cad',
                'source_image','diagram_position','confidence','notes','qty_per_machine','on_hand','validation','evidence'];
  // The CSV people export has only the columns they use. The development columns (source image, diagram position,
  // confidence, validation, evidence) are exported only in team mode.
  const PUBLIC_COLS = ['sku','sku_8digit','name_en','name_es','module','subassembly','price_cad','qty_per_machine','on_hand','notes'];
  const REQUIRED = ['sku','name_en','module'];
  const CONF = ['high','medium','low','illegible'];
  // Older copies stored Spanish confidence values.
  const LEGACY_CONF = { alta: 'high', media: 'medium', baja: 'low', ilegible: 'illegible' };
  const normConf = (p) => { if (LEGACY_CONF[p.confidence]) p.confidence = LEGACY_CONF[p.confidence]; return p; };
  // Older copies carried notes that are no longer used ("name_es = translation", "Manual section: ...").
  const cleanNotes = (p) => {
    if (p.notes) p.notes = p.notes.split('; ').filter(x => !/^name_es = (translation|traducci)/i.test(x) && !/^(Manual section|Secci.n manual):/i.test(x)).join('; ');
    return p;
  };
  // Saved copies and CSV files from before the columns were renamed used Spanish names. They still load.
  const LEGACY_KEYS = { nombre_en: 'name_en', nombre_es: 'name_es', modulo: 'module', subconjunto: 'subassembly', precio_cad: 'price_cad',
    imagen_origen: 'source_image', posicion_en_diagrama: 'diagram_position', confianza: 'confidence', notas: 'notes',
    cant_por_maquina: 'qty_per_machine', conteo: 'on_hand', validacion: 'validation', evidencia: 'evidence', sku_8dig: 'sku_8digit' };
  const upgradeKeys = (p) => {
    for (const [old, now] of Object.entries(LEGACY_KEYS)) if (old in p) { if (p[now] === undefined) p[now] = p[old]; delete p[old]; }
    if (p.validation === 'validada') p.validation = 'verified'; else if (p.validation === 'pendiente') p.validation = 'pending';
    return p;
  };
  const migrate = (p) => cleanNotes(normConf(upgradeKeys(p)));
  const isCount = (v) => v === '' || v == null || /^\d{1,6}$/.test(String(v).trim());
  const needsReview = (p) => p.confidence === 'medium' || p.confidence === 'low' || p.confidence === 'illegible';
  // Only parts explicitly marked 'pending' wait for validation; everything else counts as verified.
  const isPending = (p) => p.validation === 'pending';
  const inView = (p) => (VALIDATE && state.view === 'validate') === isPending(p);

  let parts = [];

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  let seeded = null;

      const raw = localStorage.getItem(STORAGE_KEY);

    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: 2, parts, seeded: seeded ? [...seeded] : undefined })); }
    catch (e) { storageFailed(); }

  // ---------- CSV ----------
  function parseCSV(text) {
    text = text.replace(/^﻿/, '');
    const rows = []; let row = []; let f = ''; let q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
        else f += c;
      } else if (c === '"') q = true;
      else if (c === ',') { row.push(f); f = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(f); rows.push(row); row = []; f = '';
      } else f += c;

  };

  // Validates a CSV and returns { parts, errors, warnings }
  function validateCSV(text) {
    const errors = [], warnings = [];
    const rows = parseCSV(text);

    const header = rows[0].map(h => { const k = h.trim().toLowerCase(); return LEGACY_KEYS[k] || k; });
    const missing = REQUIRED.filter(c => !header.includes(c));
    if (missing.length) errors.push('Missing required columns: ' + missing.join(', ') + '.');
    const unknown = header.filter(h => h && !COLS.includes(h));
    if (unknown.length) warnings.push('Ignored columns: ' + unknown.join(', ') + '.');
    if (missing.length) return { parts: [], errors, warnings };
    const seen = new Map(); const out = [];
    rows.slice(1).forEach((r, i) => {
      const line = i + 2;
      if (r.length !== header.length) { errors.push(`Line ${line}: has ${r.length} columns, expected ${header.length}.`); return; }
      const p = {}; COLS.forEach(c => { const k = header.indexOf(c); p[c] = k >= 0 ? r[k].trim() : ''; });
      if (!p.sku) { errors.push(`Line ${line}: empty SKU.`); return; }
      if (!p.name_en) errors.push(`Line ${line} (${p.sku}): missing name_en.`);
      if (p.module && !MODULES.includes(p.module)) errors.push(`Line ${line} (${p.sku}): invalid module "${p.module}". Use: ${MODULES.join(', ')}.`);
      p.price_cad = p.price_cad.replace(',', '.');
      if (p.price_cad && !isPrice(p.price_cad)) errors.push(`Line ${line} (${p.sku}): price "${p.price_cad}" is not a valid number.`);
      migrate(p);
      if (!header.includes('validation')) p.validation = 'verified';
      if (!isCount(p.qty_per_machine) || !isCount(p.on_hand)) errors.push(`Line ${line} (${p.sku}): quantities must be whole numbers, 0 or more.`);
      if (p.confidence && !CONF.includes(p.confidence)) warnings.push(`Line ${line} (${p.sku}): unknown confidence "${p.confidence}".`);
      const key = p.sku.toUpperCase();
      if (seen.has(key)) errors.push(`Line ${line}: duplicate SKU ${p.sku} (already on line ${seen.get(key)}).`);
      else seen.set(key, line);
      out.push(p);
    });
    if (!out.length && !errors.length) errors.push('The file has no parts.');
    return { parts: out, errors, warnings };
  }

  // ---------- part sketches ----------

  };
  // First matching rule wins, so order matters.
  const KIND_RULES = [

  const kindOf = (p) => {
    const n = String(p.name_en || '').toLowerCase();
    for (const [re, k] of KIND_RULES) if (re.test(n)) return k;

  };
  const sketch = (p) => `<svg class="sketch" viewBox="0 0 64 64" aria-hidden="true">${ICONS[kindOf(p)]}</svg>`;

  // ---------- translation ----------
  // Suggests the other language for a part name (English <-> Spanish). Providers run in this order:
  //   1. a part already in the catalog with the same name,
  //   2. the glossary (data/glossary.csv) plus a few grammar rules,
  //   3. an optional remote service (AI). It is off until TRANSLATE_REMOTE_URL is set; see the README.
  const TRANSLATE_REMOTE_URL = '';
  const glossary = { en: new Map(), es: new Map(), maxEn: 1, maxEs: 1 };
  // Words kept as they are: units and standards.
  const KEEP_WORDS = new Set(['mm', 'cm', 'kg', 'kw', 'bar', 'x', 'v', 'w', 'fep', 'epdm', 'fkm', 'nbr', 'pvc', 'ul', 'ce', 'eu', 'ue', 'usb', 'ntc', 'dn']);
  const ES_DE = new Set(['de', 'del']);

  function buildGlossary(rows) {
    glossary.en.clear(); glossary.es.clear(); glossary.maxEn = glossary.maxEs = 1;
    for (const r of rows) {
      let en = String(r.en || '').trim().toLowerCase(), es = String(r.es || '').trim();
      let pos = (r.pos || 'N').trim(), dir = '';
      if (/[<>]$/.test(pos)) { dir = pos.slice(-1); pos = pos.slice(0, -1); }   // '>' English to Spanish only, '<' Spanish to English only
      if (dir === '<') [en, es] = [es.toLowerCase(), r.en.trim()];                // a '<' row is written as: spanish,english
      if (!en || !es) continue;
      const e = { en, es, pos, gen: (r.gen || '').trim() };
      if (dir !== '<' && !glossary.en.has(en)) { glossary.en.set(en, e); glossary.maxEn = Math.max(glossary.maxEn, en.split(' ').length); }
      const k = norm(es);
      if (dir !== '>' && !glossary.es.has(k)) { glossary.es.set(k, e); glossary.maxEs = Math.max(glossary.maxEs, k.split(' ').length); }
    }
  }

  function tokenize(text) {
    const out = [];
    const re = /[(),;"]|[^\s(),;"]+/g; let m;
    while ((m = re.exec(text))) {
      const raw = m[0];
      if (/^[(),;"]$/.test(raw)) { out.push({ t: 'punct', raw }); continue; }
      const word = raw.replace(/\.+$/, '');
      out.push(/^[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ'-]*$/.test(word) ? { t: 'word', raw: word } : { t: 'spec', raw });
    }
    return out;
  }

  // Plural and feminine variants of one word, as keys into the glossary of that language.
  function variants(w, lang) {
    const l = lang === 'en' ? w.toLowerCase() : norm(w), out = [];
    if (lang === 'en') {
      if (l.endsWith('ies')) out.push({ word: l.slice(0, -3) + 'y', plural: true });
      if (l.endsWith('es')) out.push({ word: l.slice(0, -2), plural: true });
      if (l.endsWith('s')) out.push({ word: l.slice(0, -1), plural: true });
      return out;
    }
    const bases = [{ w: l, plural: false }];
    if (l.endsWith('es')) bases.push({ w: l.slice(0, -2), plural: true });
    if (l.endsWith('s')) bases.push({ w: l.slice(0, -1), plural: true });
    for (const b of bases) {
      if (b.plural) out.push({ word: b.w, plural: true, fem: false });
      if (b.w.endsWith('a')) out.push({ word: b.w.slice(0, -1) + 'o', plural: b.plural, fem: true });
    }
    return out;
  }

  // Longest glossary phrase that starts at words[0].
  function lookup(words, lang) {
    const map = lang === 'en' ? glossary.en : glossary.es, max = lang === 'en' ? glossary.maxEn : glossary.maxEs;
    const key = (ws) => lang === 'en' ? ws.join(' ').toLowerCase() : ws.map(norm).join(' ');
    for (let len = Math.min(max, words.length); len >= 1; len--) {
      const ws = words.slice(0, len);
      const hit = map.get(key(ws));
      if (hit) return { entry: hit, len, plural: false, fem: false };
      for (const v of variants(ws[len - 1], lang)) {
        const h = map.get(key([...ws.slice(0, -1), v.word]));
        if (h) return { entry: h, len, plural: !!v.plural, fem: !!v.fem };
      }
    }
    return null;
  }

  const isAdj = (h) => h.entry.pos === 'A' || h.entry.pos === 'AI' || h.entry.pos === 'AP';
  const pluralOf = (w, lang) => lang === 'es' ? (/[aeiouáéíóú]$/i.test(w) ? w + 's' : w + 'es') : (/(s|x|ch|sh)$/i.test(w) ? w + 'es' : w + 's');
  const feminine = (es, entry) => (entry.pos === 'AI' || es.includes(' ') || !/o$/.test(es)) ? es : es.slice(0, -1) + 'a';

  function convertSpec(raw, from) {
    return from === 'en'
      ? raw.replace(/(\d+\/\d+)-way/gi, '$1 vías').replace(/(\d)\.(\d)/g, '$1,$2')
      : raw.replace(/(\d),(\d)/g, '$1.$2');
  }

  // A run is a stretch of words with no number, bracket or function word in between.
  function renderRun(units, from) {
    const to = from === 'en' ? 'es' : 'en';
    const nounish = (u) => u.unk || (u.hit && !isAdj(u.hit));
    const name = (u) => u.unk ? u.unk : (from === 'en' ? u.hit.entry.es : u.hit.entry.en);
    const withPlural = (u) => (u.hit && u.hit.plural) ? pluralOf(name(u), to) : name(u);
    const adjs = units.filter(u => u.hit && isAdj(u.hit));
    const nouns = units.filter(nounish);
    if (!nouns.length) return adjs.map(name).join(' ');
    if (from === 'en') {
      // English puts modifiers first ("water pump cover"); Spanish puts the main noun first ("tapa de bomba de agua").
      const head = nouns[nouns.length - 1], mods = nouns.slice(0, -1).reverse();
      const gen = head.hit ? head.hit.entry.gen : 'm', pl = head.hit && head.hit.plural;
      const adjTxt = adjs.map(a => {
        let w = a.hit.entry.es;
        if (gen === 'f') w = feminine(w, a.hit.entry);
        return pl ? pluralOf(w, 'es') : w;
      });
      return [withPlural(head), ...mods.map(m => 'de ' + name(m)), ...adjTxt].join(' ');
    }
    // Spanish -> English: the main noun comes first; "A de B" becomes "B A".
    const chain = nouns.slice().reverse();
    const pre = adjs.filter(a => a.hit.entry.pos !== 'AP').map(name), post = adjs.filter(a => a.hit.entry.pos === 'AP').map(name);
    const head = nouns[0];
    const chainTxt = chain.map(u => u === head ? withPlural(u) : name(u));
    return [...pre, ...chainTxt, ...post].join(' ');
  }

  // Glossary translation of a whole name. Returns { text, unknown }.
  function translateGlossary(text, from) {
    const toks = tokenize(text);
    if (from === 'es') {
      for (let i = 0; i < toks.length - 1; i++) {
        if (toks[i].t === 'spec' && /^\d+\/\d+$/.test(toks[i].raw) && toks[i + 1].t === 'word' && norm(toks[i + 1].raw) === 'vias') {
          toks.splice(i, 2, { t: 'spec', raw: toks[i].raw + '-way' });
        }
      }
    }
    const items = [], unknown = []; let run = null, assy = false, firstWord = true;
    let deferred = null;   // "2/2-way" comes before the noun in English and after it in Spanish
    const flush = () => { if (run) { items.push({ run }); run = null; } if (deferred) { items.push({ raw: deferred }); deferred = null; } };
    for (let i = 0; i < toks.length;) {
      const tk = toks[i];
      if (tk.t === 'punct') {
        if (from === 'es' && tk.raw === '(' && toks[i + 1] && norm(toks[i + 1].raw) === 'conjunto' && toks[i + 2] && toks[i + 2].raw === ')') { assy = true; i += 3; continue; }
        flush(); items.push({ raw: tk.raw, punct: true }); i++; continue;
      }
      if (tk.t === 'spec') {
        flush();
        if (from === 'en' && /-way$/i.test(tk.raw)) deferred = convertSpec(tk.raw, from); else items.push({ raw: convertSpec(tk.raw, from) });
        i++; continue;
      }
      const low = tk.raw.toLowerCase();
      if (from === 'en' && (low === 'assy' || low === 'assembly')) { assy = true; i++; firstWord = false; continue; }
      if (from === 'es' && ES_DE.has(norm(tk.raw))) { run = run || []; i++; firstWord = false; continue; }
      const seq = []; for (let j = i; j < toks.length && toks[j].t === 'word'; j++) seq.push(toks[j].raw);
      const hit = lookup(seq, from);
      if (!hit && KEEP_WORDS.has(low)) { flush(); items.push({ raw: tk.raw }); i++; firstWord = false; continue; }
      if (hit && hit.entry.pos === 'X') {
        flush(); items.push({ raw: from === 'en' ? hit.entry.es : (/^[A-Z]/.test(hit.entry.es) ? hit.entry.es : hit.entry.en) });
        i += hit.len; firstWord = false; continue;
      }
      if (hit) { (run = run || []).push({ hit }); i += hit.len; firstWord = false; continue; }
      const proper = (/^[A-ZÀ-Ý]/.test(tk.raw) && !firstWord) || (tk.raw.length >= 2 && tk.raw === tk.raw.toUpperCase());
      firstWord = false;
      if (proper) { flush(); items.push({ raw: tk.raw }); i++; continue; }
      (run = run || []).push({ unk: tk.raw.toLowerCase() }); unknown.push(tk.raw); i++;
    }
    flush();
    if (assy) {
      // Spanish puts "(conjunto)" at the end; the manual puts "assy." right after the main noun.
      const at = from === 'en' ? -1 : items.findIndex(it => it.run);
      if (at < 0) items.push({ raw: from === 'en' ? '(conjunto)' : 'assy.' }); else items.splice(at + 1, 0, { raw: 'assy.' });
    }
    // join, with sensible spacing around brackets, commas and quotes
    let out = '', quoteOpen = false;
    for (const it of items) {
      const piece = it.run ? renderRun(it.run, from) : it.raw;
      if (!piece) continue;
      if (it.punct && piece === '"') { out += quoteOpen ? '"' : (out ? ' "' : '"'); quoteOpen = !quoteOpen; continue; }
      if (it.punct && (piece === ')' || piece === ',' || piece === ';')) { out += piece; continue; }
      const prev = out.slice(-1);
      out += (!out || prev === '(' || (prev === '"' && quoteOpen)) ? piece : ' ' + piece;
    }
    out = out.replace(/\s+/g, ' ').trim();
    return { text: out.charAt(0).toUpperCase() + out.slice(1), unknown };
  }

  // Best suggestion for `text` written in `from` ('en' or 'es'). Returns { text, unknown, source } or null.
  async function suggestTranslation(text, from) {
    const t = String(text || '').trim(); if (!t) return null;
    const to = from === 'en' ? 'es' : 'en';
    const mine = from === 'en' ? 'name_en' : 'name_es', other = from === 'en' ? 'name_es' : 'name_en';
    const key = norm(t);
    const known = parts.find(p => p[other] && norm(p[mine]) === key);
    if (known) return { text: known[other], unknown: [], source: 'catalog' };
    const g = translateGlossary(t, from);
    if (g.unknown.length && TRANSLATE_REMOTE_URL) {
      try {
        const res = await fetch(TRANSLATE_REMOTE_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: t, from, to, draft: g.text, unknown: g.unknown }) });
        if (res.ok) { const j = await res.json(); if (j && j.text) return { text: j.text, unknown: [], source: 'ai' }; }
      } catch (e) { /* fall back to the glossary draft */ }
    }
    return { text: g.text, unknown: g.unknown, source: 'glossary' };
  }
  async function loadGlossary() {
    try {
      const res = await fetch('data/glossary.csv', { cache: 'no-store' }); if (!res.ok) return;
      const rows = parseCSV(await res.text()), head = rows[0].map(h => h.trim().toLowerCase());
      buildGlossary(rows.slice(1).map(r => Object.fromEntries(head.map((h, i) => [h, r[i]]))));
    } catch (e) { /* opened as a local file: only catalog names are suggested */ }
  }
  // ---------- end translation ----------

  // ---------- filtering and sorting ----------
  const matches = (p, skipModule) => {
    if (!inView(p)) return false;
    if (!skipModule && state.mod && p.module !== state.mod) return false;
    if (state.sub && p.subassembly !== state.sub) return false;
    if (state.noPrice && p.price_cad) return false;
    if (state.review && !needsReview(p)) return false;
    const q = norm(state.q.trim());
    if (!q) return true;
    return [p.sku, p.sku_8digit, p.name_en, p.name_es].some(v => norm(v).includes(q));
  };
  const priceNum = (v) => { const n = Number(String(v || '').replace(',', '.')); return v === '' || v == null || isNaN(n) ? -1 : n; };
  function filtered() {
    const a = parts.filter(p => matches(p, false));
    switch (state.sort) {
      case 'sku': a.sort((x, y) => x.sku.localeCompare(y.sku, 'en', { numeric: true })); break;
      case 'name': a.sort((x, y) => x.name_en.localeCompare(y.name_en, 'en', { sensitivity: 'base' })); break;
      case 'price': a.sort((x, y) => priceNum(y.price_cad) - priceNum(x.price_cad)); break;
      case 'review': a.sort((x, y) => Number(needsReview(y)) - Number(needsReview(x))); break;
    }
    return a;
  }
  const secKey = (s) => { const m = /^[\d.]+/.exec(s || ''); return m ? m[0].split('.').filter(Boolean).map(Number) : [9999]; };
  const cmpSec = (a, b) => {
    const x = secKey(a), y = secKey(b);
    for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (x[i] ?? -1) - (y[i] ?? -1); if (d) return d; }
    return a.localeCompare(b);
  };

  // ---------- render ----------
  function renderControls() {
    const nPend = parts.filter(isPending).length, nOk = parts.length - nPend;
    $('views').classList.toggle('hidden', !VALIDATE);
    if (VALIDATE) {
      $('views').innerHTML = `<button type="button" role="tab" data-act="view" data-view="catalog" aria-selected="${state.view === 'catalog'}">Catalog<span class="n">${nOk}</span></button>` +
        `<button type="button" role="tab" data-act="view" data-view="validate" aria-selected="${state.view === 'validate'}">To validate<span class="n">${nPend}</span></button>`;
    }
    $('tagline').innerHTML = VALIDATE ? `<b>${nOk}</b> verified · <b>${nPend}</b> to validate`
      : `<b>${nOk}</b> ${nOk === 1 ? 'part' : 'parts'} · Mastrena II`;
    const counts = { '': 0 };
    MODULES.forEach(m => counts[m] = 0);
    parts.forEach(p => { if (matches(p, true)) { counts['']++; if (counts[p.module] !== undefined) counts[p.module]++; } });
    $('tabs').innerHTML = [['', 'All'], ...MODULES.map(m => [m, m])].map(([v, label]) =>
      `<button class="tab" role="tab" type="button" data-act="tab" data-mod="${v}" aria-selected="${state.mod === v}">${label}<span class="n">${counts[v] ?? 0}</span></button>`).join('');
    const subs = new Map();
    parts.forEach(p => { if (inView(p) && p.subassembly && (!state.mod || p.module === state.mod)) subs.set(p.subassembly, (subs.get(p.subassembly) || 0) + 1); });
    const opts = [...subs.entries()].sort((a, b) => cmpSec(a[0], b[0]));
    $('sub').innerHTML = `<option value="">All subassemblies</option>` + opts.map(([s, n]) =>
      `<option value="${esc(s)}" ${state.sub === s ? 'selected' : ''}>${esc(s)} (${n})</option>`).join('');
    $('chip-noprice').setAttribute('aria-pressed', state.noPrice);
    $('chip-review').setAttribute('aria-pressed', state.review);
    $('chip-review').classList.toggle('hidden', state.view !== 'validate');
    $('sort').value = state.sort;
  }

  function factsHtml(p) {
    const conf = p.confidence || '—';
    return `<dl class="facts">
      <div class="fact"><dt>Module</dt><dd>${esc(p.module || '—')}</dd></div>
      <div class="fact"><dt>8-digit SKU</dt><dd class="mono">${esc(p.sku_8digit || '—')}</dd></div>
      ${VALIDATE ? `<div class="fact"><dt>Confidence</dt><dd>${esc(conf)}</dd></div>` : ''}
      <div class="fact wide"><dt>Subassembly</dt><dd>${esc(p.subassembly || '—')}</dd></div>
      ${VALIDATE && p.page ? `<div class="fact"><dt>Manual page</dt><dd>${esc(p.page)}</dd></div>` : ''}
      ${VALIDATE ? `<div class="fact wide"><dt>Evidence</dt><dd>${esc(p.evidence || '—')}</dd></div>` : ''}
      ${p.notes ? `<div class="fact wide"><dt>Notes</dt><dd>${esc(p.notes)}</dd></div>` : ''}
    </dl>`;
  }

  function qtyHtml(p) {
    const sku = esc(p.sku);
    return `<div class="qty">
      <div class="qbox"><div class="qlabel"><span>On hand</span><span class="sample-pill">Sample</span></div>
        <div class="stepper">
          <button class="sbtn" type="button" data-act="dec" data-sku="${sku}" aria-label="One less">&minus;</button>
          <input class="qin" data-field="on_hand" data-sku="${sku}" inputmode="numeric" value="${esc(p.on_hand || '0')}" aria-label="Pieces on hand">
          <button class="sbtn" type="button" data-act="inc" data-sku="${sku}" aria-label="One more">+</button>
        </div></div>
      <div class="qbox"><div class="qlabel"><span>Per machine</span><span class="sample-pill">Sample</span></div>
        <input class="qin" data-field="qty_per_machine" data-sku="${sku}" inputmode="numeric" value="${esc(p.qty_per_machine)}" placeholder="—" aria-label="Quantity per machine"></div>
    </div>`;
  }

  function detailHtml(p) {
    if (editing === p.sku) {
      return `<div class="detail"><form class="form" data-form="edit" data-orig="${esc(p.sku)}" novalidate>
        ${formFields(p, 'edit')}
        <div class="full actions"><button class="btn primary" type="submit">Save</button><button class="btn" type="button" data-act="cancel-edit">Cancel</button></div>
      </form></div>`;
    }
    const confirmBox = confirming === p.sku ? `
      <div class="confirm" role="alert">Remove <b class="mono">${esc(p.sku)}</b> (${esc(p.name_en)}) from the catalog?
        <div class="actions"><button class="btn danger" type="button" data-act="del-yes" data-sku="${esc(p.sku)}">Yes, remove</button><button class="btn" type="button" data-act="del-no">Cancel</button></div>
      </div>` : '';
    return `<div class="detail">
      ${qtyHtml(p)}
      <div class="detail-grid">
        ${factsHtml(p)}
        <button class="lbl-thumb" type="button" data-act="label" data-sku="${esc(p.sku)}" aria-label="Enlarge the bag label of ${esc(p.sku)}" title="Click to enlarge and print">
          ${labelHtml(p, 1)}<span class="lbl-thumb-hint">Click to enlarge and print</span>
        </button>
      </div>
      <div class="actions">
        ${isPending(p) ? `<button class="btn sm primary" type="button" data-act="verify" data-sku="${esc(p.sku)}">Mark verified</button>` : ''}
        <button class="btn sm" type="button" data-act="edit" data-sku="${esc(p.sku)}">Edit</button>
        ${isPending(p) || !VALIDATE ? '' : `<button class="btn sm" type="button" data-act="unverify" data-sku="${esc(p.sku)}">Send back to validation</button>`}
        <button class="btn sm warnlink" type="button" data-act="del" data-sku="${esc(p.sku)}">Remove</button>
      </div>${confirmBox}</div>`;
  }

  // SKUs that have an image in img/<sku>.jpg, and whether it is a real photo or a generated illustration
  const PHOTOS = new Map([['140.763', 'photo'], ['140.741', 'illustration'], ['127.852', 'illustration'], ['123.366', 'illustration'], ['130.326', 'illustration']]);
  function rowHtml(p) {
    const price = fmtPrice(p.price_cad);
    const open = openSku === p.sku;
    const review = VALIDATE && needsReview(p) ? `<span class="pill warn" title="Check this part against the paper manual">Review</span>` : '';
    return `<li class="row${open ? ' open' : ''}" data-sku="${esc(p.sku)}">
      <div class="row-head" role="button" tabindex="0" aria-expanded="${open}" data-act="toggle" data-sku="${esc(p.sku)}">
        <input class="sel" type="checkbox" data-sku="${esc(p.sku)}" ${selected.has(p.sku) ? 'checked' : ''} aria-label="Select ${esc(p.sku)}">
        <div class="thumb" title="Representative sketch, not a photo of the exact part">${sketch(p)}${PHOTOS.has(p.sku) ? `<img class="pimg" src="img/${encodeURIComponent(p.sku)}.jpg" alt="${PHOTOS.get(p.sku) === 'photo' ? 'Photo' : 'Illustration'} of ${esc(p.sku)}">` : ''}</div>
        <div class="info">
          <div class="name">${esc(p.name_en)}</div>
          <div class="sub2"><span class="mono">${esc(p.sku)}</span>${p.name_es ? ' · ' + esc(p.name_es) : ''}${PHOTOS.get(p.sku) === 'illustration' ? ' <span class="pill ill" title="Generated from a photo of the part; details such as lettering may differ from the real part">Illustration</span>' : ''}${review}</div>
        </div>
        <div class="price ${price ? '' : 'none'}">${price ?? 'No price'}</div>
      </div>
      ${open ? detailHtml(p) : ''}
    </li>`;
  }

  function render() {
    renderControls();
    const list = filtered();
    const shown = list.slice(0, state.limit);
    $('count').textContent = parts.length ? `Showing ${shown.length} of ${list.length}` : '';
    $('selall').disabled = !list.length;
    if (!parts.length) {
      $('list').innerHTML = `<li class="empty"><b>No parts yet</b>Add the first one, or import a catalog CSV.<br><button class="btn primary" type="button" data-act="add">+ Add part</button></li>`;
    } else if (!list.length) {
      const done = state.view === 'validate' && !parts.some(isPending);
      $('list').innerHTML = done
        ? `<li class="empty"><b>Everything is verified</b>No parts are waiting for validation.</li>`
        : `<li class="empty"><b>No matches</b>No parts fit the current search and filters.<br><button class="btn" type="button" data-act="reset">Clear filters</button></li>`;
    } else {
      $('list').innerHTML = shown.map(rowHtml).join('');
      drawBarcodes($('list'));
    }
    $('btn-more').classList.toggle('hidden', list.length <= state.limit);
    refreshSelection();
  }

  function refreshSelection() {
    const list = filtered();
    const nSel = list.filter(p => selected.has(p.sku)).length;
    const all = $('selall');
    all.checked = list.length > 0 && nSel === list.length;
    all.indeterminate = nSel > 0 && nSel < list.length;
    renderBulk();
  }

  function renderBulk() {
    const n = selected.size;
    $('bulk').classList.toggle('hidden', !n);
    document.body.classList.toggle('has-bulk', n > 0);
    $('bulk-n').textContent = `${n} selected`;
    $('bulk-verify').classList.toggle('hidden', state.view !== 'validate');
  }

  function formFields(p, idp) {
    const f = (name, label, extra = '', cls = '', hint = false) =>
      `<label class="${cls}">${label}<input name="${name}" value="${esc(p[name])}" ${extra}>${hint ? `<span class="hint" data-hint="${name}"></span>` : ''}</label>`;
    return `
      ${f('sku', 'SKU (Article no.) *', 'required autocomplete="off" class="mono"')}
      ${f('sku_8digit', '8-digit SKU', 'inputmode="numeric" class="mono"')}
      ${f('name_en', 'Name (EN) *', 'required autocomplete="off"', 'full', true)}
      ${f('name_es', 'Name (ES)', 'autocomplete="off"', 'full', true)}
      <label>Module *<select name="module" required>
        ${MODULES.map(m => `<option ${p.module === m ? 'selected' : ''}>${m}</option>`).join('')}
      </select></label>
      ${f('subassembly', 'Subassembly')}
      ${f('price_cad', 'Price CAD (optional)', 'inputmode="decimal" placeholder="No price"')}
      ${VALIDATE ? `<label>Confidence<select name="confidence">
        <option value="" ${!p.confidence ? 'selected' : ''}>—</option>
        ${CONF.map(c => `<option ${p.confidence === c ? 'selected' : ''}>${c}</option>`).join('')}
      </select></label>` : ''}
      ${f('qty_per_machine', 'Per machine', 'inputmode="numeric" placeholder="—"')}
      ${f('on_hand', 'On hand', 'inputmode="numeric" placeholder="0"')}
      ${VALIDATE ? f('source_image', 'Source image') + f('diagram_position', 'Diagram position') : ''}
      <label class="full">Notes<textarea name="notes" rows="2">${esc(p.notes)}</textarea></label>
      <div class="err full" id="${idp}-err" role="alert"></div>`;
  }

  function readForm(form, base) {
    const p = {}; COLS.forEach(c => { const el = form.elements[c]; p[c] = el ? el.value.trim() : (base && base[c] != null ? base[c] : ''); });
    p.price_cad = p.price_cad.replace(',', '.');
    return p;
  }
  function checkPart(p, origSku) {
    if (!p.sku) return 'SKU is required.';
    if (!p.name_en) return 'English name is required.';
    if (!MODULES.includes(p.module)) return 'Choose a module.';
    if (p.price_cad && !isPrice(p.price_cad)) return 'Price must be a number, for example 12.50.';
    if (!isCount(p.qty_per_machine) || !isCount(p.on_hand)) return 'Quantities must be whole numbers, 0 or more.';
    const dup = parts.find(x => x.sku.toUpperCase() === p.sku.toUpperCase() && x.sku !== origSku);
    if (dup) return `A part with SKU ${dup.sku} already exists (${dup.name_en}).`;
    return '';
  }

  function toast(msg, kind) {
    const t = $('toast');
    t.textContent = msg; t.className = 'toast' + (kind ? ' ' + kind : '');
    clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add('hidden'), 4200);
  }

  // ---------- sheets ----------
  function openSheet(id) { $(id).classList.remove('hidden'); }
  function closeSheets() {
    document.querySelectorAll('.sheet').forEach(s => s.classList.add('hidden'));
    $('add-form').innerHTML = ''; pendingImport = null;
  }
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheets(); });
  document.querySelectorAll('.sheet').forEach(s => s.addEventListener('click', (e) => { if (e.target === s) closeSheets(); }));

  // ---------- name translation in the forms ----------
  // Typing in one name field fills the other with a suggestion. A name somebody typed by hand is never overwritten.
  const NAME_FIELDS = { name_en: ['en', 'name_es'], name_es: ['es', 'name_en'] };
  function setHint(form, field, text, warn) {
    const h = form.querySelector(`[data-hint="${field}"]`);
    if (h) { h.textContent = text; h.classList.toggle('warn', !!warn); }
  }
  function hintText(r) {
    if (r.source === 'catalog') return 'Same name as a part already in the catalog.';
    if (r.source === 'ai') return 'Suggested by the translation service. Check it.';
    return r.unknown.length ? `Suggested translation. Not in the glossary: ${r.unknown.join(', ')}. Check it.` : 'Suggested translation. Check it.';
  }
  let translateTimer;
  document.addEventListener('input', (e) => {
    const el = e.target, cfg = el.form && el.form.dataset.form && NAME_FIELDS[el.name];
    if (!cfg) return;
    const [from, otherName] = cfg, form = el.form, other = form.elements[otherName], typed = el.value;
    el.dataset.auto = ''; setHint(form, el.name, '');     // typed by hand, so it is no longer a suggestion
    clearTimeout(translateTimer);
    translateTimer = setTimeout(async () => {
      if (other.value.trim() && other.dataset.auto !== '1') return;
      if (!typed.trim()) { if (other.dataset.auto === '1') { other.value = ''; other.dataset.auto = ''; setHint(form, otherName, ''); } return; }
      const r = await suggestTranslation(typed, from);
      if (!r || !el.isConnected || el.value !== typed || (other.value.trim() && other.dataset.auto !== '1')) return;
      other.value = r.text; other.dataset.auto = '1';
      setHint(form, otherName, hintText(r), r.unknown.length > 0);
    }, 300);
  });

  // ---------- add ----------
  function openAdd() {
    $('add-form').innerHTML = `<form class="form" data-form="add" novalidate>
      ${formFields({ module: state.mod || 'Mechanical', subassembly: state.sub || '' }, 'add')}
      <div class="full actions"><button class="btn primary" type="submit">Add part</button><button class="btn" type="button" data-act="close">Cancel</button></div>
    </form>`;
    openSheet('sheet-add');
    $('add-form').querySelector('input[name=sku]').focus();
  }
  $('btn-add').onclick = openAdd;

  document.addEventListener('submit', (e) => {
    const form = e.target; e.preventDefault();
    const p = readForm(form, form.dataset.form === 'edit' ? parts.find(x => x.sku === form.dataset.orig) : null);
    if (form.dataset.form === 'add') {
      const err = checkPart(p, null);
      if (err) { $('add-err').textContent = err; return; }
      p.validation = 'verified'; p.evidence = 'Added manually';
      parts.unshift(p); save(); closeSheets();
      Object.assign(state, { view: 'catalog', q: '', mod: '', sub: '', noPrice: false, review: false, sort: 'manual', limit: PAGE });
      $('q').value = ''; openSku = p.sku; editing = null; confirming = null;
      render(); scrollToRow(p.sku); toast(`Part ${p.sku} added`);
    } else if (form.dataset.form === 'edit') {
      const orig = form.dataset.orig;
      const err = checkPart(p, orig);
      if (err) { $('edit-err').textContent = err; return; }
      parts[parts.findIndex(x => x.sku === orig)] = p;
      if (orig !== p.sku && selected.delete(orig)) selected.add(p.sku);
      openSku = p.sku; editing = null; save(); render(); toast(`Part ${p.sku} saved`);
    }
  });
  function scrollToRow(sku) {
    const row = [...document.querySelectorAll('.row')].find(r => r.dataset.sku === sku);
    if (row) row.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  // ---------- list interactions ----------
  const toggleRow = (sku) => { openSku = openSku === sku ? null : sku; editing = null; confirming = null; render(); };
  document.addEventListener('click', (e) => {
    if (e.target.closest('.sel')) return;
    const b = e.target.closest('[data-act]'); if (!b) return;
    const sku = b.dataset.sku;
    switch (b.dataset.act) {
      case 'toggle': toggleRow(sku); break;
      case 'tab': state.mod = b.dataset.mod; state.sub = ''; state.limit = PAGE; render(); break;
      case 'edit': editing = sku; confirming = null; render(); break;
      case 'cancel-edit': editing = null; render(); break;
      case 'del': confirming = sku; editing = null; render(); break;
      case 'del-no': confirming = null; render(); break;
      case 'del-yes':
        parts = parts.filter(x => x.sku !== sku); selected.delete(sku);
        confirming = null; openSku = null; save(); render(); toast(`Part ${sku} removed`); break;
      case 'label': showLabel(sku); break;
      case 'view':
        Object.assign(state, { view: b.dataset.view, q: '', mod: '', sub: '', noPrice: false, review: false, limit: PAGE });
        $('q').value = ''; selected.clear(); openSku = editing = confirming = null; render(); break;
      case 'verify': {
        const p = parts.find(x => x.sku === sku); if (!p) break;
        p.validation = 'verified'; p.confidence = 'high'; p.evidence = `Validated against the paper manual on ${today()}`;
        selected.delete(sku); openSku = null; editing = null; save(); render(); toast(`Part ${sku} verified and moved to the catalog`); break;
      }
      case 'unverify': {
        const p = parts.find(x => x.sku === sku); if (!p) break;
        p.validation = 'pending'; selected.delete(sku); openSku = null; save(); render(); toast(`Part ${sku} sent back to validation`); break;
      }
      case 'dec': case 'inc': {
        const p = parts.find(x => x.sku === sku); if (!p) break;
        const next = Math.max(0, (parseInt(p.on_hand || '0', 10) || 0) + (b.dataset.act === 'inc' ? 1 : -1));
        p.on_hand = String(next); save();
        b.parentElement.querySelector('.qin').value = next; break;
      }
      case 'add': openAdd(); break;
      case 'close': closeSheets(); break;
      case 'reset':
        Object.assign(state, { q: '', mod: '', sub: '', noPrice: false, review: false, limit: PAGE });
        $('q').value = ''; render(); break;
    }
  });
  document.addEventListener('keydown', (e) => {
    const h = e.target.closest && e.target.closest('.row-head');
    if (h && e.target === h && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggleRow(h.dataset.sku); }
  });
  document.addEventListener('change', (e) => {
    const q = e.target.closest('.qin');
    if (q) {
      const p = parts.find(x => x.sku === q.dataset.sku); if (!p) return;
      const v = q.value.trim(), field = q.dataset.field;
      if (!isCount(v)) { q.value = p[field] || (field === 'on_hand' ? '0' : ''); toast('Enter a whole number, 0 or more', 'bad'); return; }
      p[field] = v === '' ? '' : String(parseInt(v, 10));
      q.value = p[field] || (field === 'on_hand' ? '0' : '');
      save(); return;
    }
    const c = e.target.closest('.sel'); if (!c) return;
    if (c.checked) selected.add(c.dataset.sku); else selected.delete(c.dataset.sku);
    refreshSelection();
  });
  $('selall').onchange = (e) => {
    const list = filtered();
    if (e.target.checked) list.forEach(p => selected.add(p.sku)); else list.forEach(p => selected.delete(p.sku));
    render();
  };
  $('q').addEventListener('input', (e) => { state.q = e.target.value; state.limit = PAGE; render(); });
  $('sub').addEventListener('change', (e) => { state.sub = e.target.value; state.limit = PAGE; render(); });
  $('sort').addEventListener('change', (e) => { state.sort = e.target.value; state.limit = PAGE; render(); });
  $('chip-noprice').onclick = () => { state.noPrice = !state.noPrice; state.limit = PAGE; render(); };
  $('chip-review').onclick = () => { state.review = !state.review; state.limit = PAGE; render(); };
  $('btn-more').onclick = () => { state.limit += PAGE; render(); };

  // ---------- bulk price ----------
  function bulkSet(value) {
    const err = $('bulk-err'); err.textContent = '';
    if (value !== '' && !isPrice(value)) { err.textContent = 'Enter a price like 12.50.'; return; }
    const v = value.replace(',', '.');
    let n = 0; parts.forEach(p => { if (selected.has(p.sku)) { p.price_cad = v; n++; } });
    save(); $('bulk-price').value = ''; render();
    const noun = n === 1 ? 'part' : 'parts';
    toast(v ? `Price set on ${n} ${noun}` : `Price cleared on ${n} ${noun}`);
  }
  $('bulk-apply').onclick = () => {
    const v = $('bulk-price').value.trim();
    if (!v) { $('bulk-err').textContent = 'Enter a price, or use Clear price.'; return; }
    bulkSet(v);
  };
  $('bulk-clear').onclick = () => bulkSet('');
  $('bulk-verify').onclick = () => {
    let n = 0;
    parts.forEach(p => { if (selected.has(p.sku) && isPending(p)) { p.validation = 'verified'; p.confidence = 'high'; p.evidence = `Validated against the paper manual on ${today()}`; n++; } });
    selected.clear(); openSku = null; save(); render(); toast(`${n} ${n === 1 ? 'part' : 'parts'} verified and moved to the catalog`);
  };
  $('bulk-done').onclick = () => { selected.clear(); $('bulk-err').textContent = ''; render(); };

  // ---------- labels ----------
  // Octagon logo: an octagon outline with the word Octagon in script. Replace the text, or swap the whole <svg>, to use the final artwork.
  const LOGO_SVG = '<svg class="lbl-logo" viewBox="0 0 100 100" aria-hidden="true"><path d="M31 5H69L95 31V69L69 95H31L5 69V31Z" fill="none" stroke="#000" stroke-width="7" stroke-linejoin="round"/>' +
    '<text x="50" y="57" text-anchor="middle" font-size="25" textLength="72" lengthAdjust="spacingAndGlyphs" font-family="\'Kaushan Script\', cursive" fill="#000">Octagon</text></svg>';
  let labelPart = null;
  const countOf = (id) => Math.max(1, Math.min(200, parseInt($(id).value, 10) || 1));

  function labelHtml(p, qty) {
    const date = new Date().toLocaleDateString('en-CA');
    return `<div class="lbl-box"><div class="lbl">
      <div class="lbl-side"><div class="lbl-brand"><b>Octagon Services</b><span>Mastrena parts</span></div>${LOGO_SVG}</div>
      <div class="lbl-main">
        <div class="lbl-sku">${esc(p.sku)}</div>
        <div class="lbl-rule"></div>
        <div class="lbl-en">${esc(p.name_en)}</div>
        ${p.name_es ? `<div class="lbl-es">${esc(p.name_es)}</div>` : ''}
        <div class="lbl-qty">Quantity: ${qty}</div>
        <div class="lbl-foot"><svg class="bc" data-code="${esc(p.sku)}"></svg>
          <div class="lbl-meta">${p.sku_8digit ? `SKU ${esc(p.sku_8digit)}<br>` : ''}Vancouver, BC<br>${date}</div></div>
      </div>
    </div></div>`;
  }
  function drawBarcodes(root) {
    root.querySelectorAll('svg.bc').forEach(el => {
      try { JsBarcode(el, el.dataset.code, { format: 'CODE128', height: 40, displayValue: true, fontSize: 13, margin: 0, width: 2, font: 'JetBrains Mono' }); }
      catch (err) { el.outerHTML = `<div class="msg bad">Could not generate the barcode${typeof JsBarcode === 'undefined' ? ' (no connection to cdnjs)' : ''}.</div>`; }
    });
  }
  function renderLabelPreview() {
    if (!labelPart) return;
    $('label-preview').innerHTML = labelHtml(labelPart, countOf('lbl-qty'));
    drawBarcodes($('label-preview'));
  }
  function showLabel(sku) {
    const p = parts.find(x => x.sku === sku); if (!p) return;
    labelPart = p;
    $('label-area').innerHTML = `<div class="lbl-opts">
        <label>Quantity in the bag<input id="lbl-qty" inputmode="numeric" value="1" autocomplete="off"></label>
        <label>Copies to print<input id="lbl-copies" inputmode="numeric" value="1" autocomplete="off"></label></div>
      <div id="label-preview" style="width:100%;display:flex;justify-content:center"></div>
      <p class="lbl-note">Printed at 4 × 2.4 in. In the print window, choose your label printer, or any paper and scale it down.</p>`;
    $('lbl-qty').addEventListener('input', renderLabelPreview);
    renderLabelPreview();
    openSheet('sheet-label');
  }
  $('btn-print').onclick = () => {
    if (!labelPart) return;
    const qty = countOf('lbl-qty'), copies = countOf('lbl-copies');
    $('label-print').innerHTML = Array.from({ length: copies }, () => labelHtml(labelPart, qty)).join('');
    drawBarcodes($('label-print'));
    window.print();
  };

  // ---------- export / import ----------
  $('btn-export').onclick = () => {
    const blob = new Blob(['﻿' + toCSV(parts, VALIDATE ? COLS : PUBLIC_COLS)], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `octagon-catalog-${new Date().toLocaleDateString('en-CA')}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast(`Exported ${parts.length} ${parts.length === 1 ? 'part' : 'parts'}`);
  };
  $('btn-import').onclick = () => $('file').click();
  $('file').onchange = async () => {
    const file = $('file').files[0]; $('file').value = ''; if (!file) return;
    let text;
    try { text = await file.text(); } catch (e) { toast('Could not read the file', 'bad'); return; }
    const r = validateCSV(text);
    pendingImport = r.errors.length ? null : r.parts;
    const byMod = MODULES.map(m => `${m}: ${r.parts.filter(p => p.module === m).length}`).join(' · ');
    $('import-body').innerHTML = `
      <p><b>${esc(file.name)}</b> · ${r.parts.length} parts read (${byMod}).</p>
      ${r.errors.length ? `<div class="msg bad"><b>${r.errors.length} error(s). Fix the file and import again:</b><ul>${r.errors.map(e => `<li>${esc(e)}</li>`).join('')}</ul></div>`
        : `<div class="msg">No errors. Confirming will replace the current ${parts.length} parts with these ${r.parts.length}.</div>`}
      ${r.warnings.length ? `<div class="msg warn"><b>Warnings:</b><ul>${r.warnings.map(e => `<li>${esc(e)}</li>`).join('')}</ul></div>` : ''}`;
    $('btn-import-ok').disabled = !pendingImport;
    openSheet('sheet-import');
  };
  $('btn-import-ok').onclick = async () => {
    if (!pendingImport) return;
    const list = await fetchSeed();
    seeded = new Set([...(seeded || []), ...(list || []).map(m => m.sku)]);
    parts = pendingImport; const n = parts.length; closeSheets();
    selected.clear(); openSku = editing = confirming = null; state.limit = PAGE;
    save(); render(); toast(`Catalog replaced: ${n} parts`);
  };
  $('btn-import-cancel').onclick = closeSheets;

  // ---------- startup ----------
  // First published catalog found in SEEDS, or null when none can be read (for example when opened as a local file).
  async function fetchSeed() {
    for (const url of SEEDS) {
      try {
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) continue;
        const r = validateCSV(await res.text());
        if (!r.errors.length) return r.parts;
        console.warn(url + ' has errors:', r.errors);
      } catch (e) { /* try the next one */ }
    }
    return null;
  }
  // Copies saved before the validation status existed get it from the published catalog.
  // Rows that came from the manual but are not in the published catalog are still to be validated, so they are dropped.
  async function mergeSeedFlags() {
    if (!parts.some(p => p.validation === undefined)) return;
    const list = await fetchSeed(); if (!list) return;
    const seed = new Map(list.map(x => [x.sku, x]));
    parts = parts.filter(p => {
      if (p.validation !== undefined) return true;
      const m = seed.get(p.sku);
      if (m) { p.validation = m.validation; if (!p.evidence) p.evidence = m.evidence; return true; }
      if (p.source_image && !VALIDATE) return false;
      p.validation = 'verified'; if (!p.evidence) p.evidence = 'Added manually';
      return true;
    });
    save(); render();
  }
  // Brings in the parts that are new in the published catalog, and (team mode) the ones verified by hand since the last visit.
  async function mergeNewFromSeed() {
    const list = await fetchSeed(); if (!list) return;
    const have = new Map(parts.map(p => [p.sku, p]));
    let added = 0, changed = 0;
    for (const m of list) {
      const mine = have.get(m.sku);
      if (!mine) {
        if (seeded && seeded.has(m.sku)) continue;          // it was in the catalog before and was removed on purpose
        if (!VALIDATE && isPending(m)) continue;
        parts.push(m); added++;
      } else if (VALIDATE && isPending(mine) && !isPending(m)) {
        mine.validation = m.validation; mine.confidence = m.confidence; mine.evidence = m.evidence; changed++;
      }
    }
    const idx = new Map(list.map((m, i) => [m.sku, i]));
    if (added) parts.sort((a, b) => (idx.get(a.sku) ?? -1) - (idx.get(b.sku) ?? -1));   // keep the manual order; parts added by hand stay first
    const before = seeded ? seeded.size : -1;
    seeded = new Set(list.map(m => m.sku));
    if (added || changed || before !== seeded.size) { save(); render(); }
    if (added) toast(`${added} new ${added === 1 ? 'part' : 'parts'} added to the catalog`);
  }
  async function init() {
    loadGlossary();
    if (VALIDATE) document.title += ' (validation)';
    else $('sort').querySelector('option[value="review"]').remove();
    const stored = load();
    if (stored !== null) {
      parts = VALIDATE ? stored : stored.filter(p => !isPending(p));
      render(); await mergeSeedFlags(); await mergeNewFromSeed(); return;
    }
    // First visit: load the catalog published next to the page.
    const list = await fetchSeed();
    if (list) { parts = list; seeded = new Set(list.map(m => m.sku)); save(); }
    render();
  }
  init();
})();
</script>
</body>
</html>
